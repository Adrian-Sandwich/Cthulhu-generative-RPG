name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run fast unit/smoke tests (no LLM)
        env:
          DATA_DIR: ${{ runner.temp }}/cthulhu-data
          # tests/test_frontend.py skips without node, and a skip is a silent
          # pass. CI sets this so a missing node fails the job instead.
          CI: "true"
        run: |
          mkdir -p "$DATA_DIR"
          pytest tests/test_smoke.py tests/test_engine_units.py tests/test_frontend.py tests/test_url_map.py -q

      # Catches attribute reads that do not exist. Two shipped regressions were
      # exactly that and the suite could not see either. Scoped to one rule in
      # pyrightconfig.json, so it passes today rather than needing a cleanup.
      - name: Static attribute check (pyright, one rule)
        run: pyright
