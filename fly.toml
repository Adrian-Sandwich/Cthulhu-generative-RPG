# fly.toml app configuration file generated for lighthouse-cthulhu on 2026-07-16T10:18:26-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lighthouse-cthulhu'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_DIR = '/data'
  FLASK_DEBUG = '0'
  HOST = '0.0.0.0'
  LLM_BASE_URL = 'https://api.groq.com/openai/v1'
  LLM_MODEL = 'openai/gpt-oss-120b'
  LLM_PROVIDER = 'openai'
  PORT = '8080'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 40
    soft_limit = 25

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
