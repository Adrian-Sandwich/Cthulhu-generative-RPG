# Render deploy (no credit card required on the free tier).
# Trade-offs vs Fly: the free plan has NO persistent disk (saves/feedback are
# lost on redeploy or idle spin-down) and cold-starts (~1 min) after 15 min
# idle. Fine for a playtest link; use a paid disk or Fly for durable data.
#
# Deploy: push to GitHub, then on render.com → New → Blueprint → pick this repo.
services:
  - type: web
    name: the-lighthouse
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /tmp/cthulhu           # ephemeral on free tier
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: SECRET_KEY
        generateValue: true            # stable per service
      - key: LLM_API_KEY
        sync: false                    # set in the Render dashboard (secret)
